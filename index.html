/* THEMA */

function safeStorageGet(key){

  try{
    return localStorage.getItem(key);
  }catch(e){
    return null;
  }
}


function safeStorageSet(
  key,
  value
){

  try{

    localStorage.setItem(
      key,
      value
    );

  }catch(e){}
}


function safeStorageRemove(key){

  try{

    localStorage.removeItem(
      key
    );

  }catch(e){}
}


function clearOldFormStorage(){

  OLD_STORAGE_KEYS
    .forEach(
      function(key){

        safeStorageRemove(
          key
        );

      }
    );
}

      .add('dark');

    theme

  $('darkCheck').textContent =

      ? '✓'

/* DATUM */

function today(){

  /*
   * Wordt iedere keer opnieuw uitgevoerd.
   * Formulier legen gebruikt dus altijd
   * de datum van dat moment.
   */

  var date =
    new Date();


  return (
    date.getFullYear() +
    '-' +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +
    '-' +
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    )
  );

}


function displayDate(iso){

  if(!iso){
    return '';
  }


  var parts =
    iso.split('-');


  if(
    parts.length !== 3
  ){
    return iso;
  }


  return (
    parts[2] +
    '-' +
    parts[1] +
    '-' +
    parts[0]
  );

}


/* FORMULIER */

function selected(name){

  var element =
    document.querySelector(
      'input[name="' +
      name +
      '"]:checked'
    );


  return element
    ? element.value
    : '';

}


function getState(){

  var items =
    [];


  for(
    var i = 1;
    i <= 15;
    i++
  ){

    items.push({

      status:
        selected(
          'q' +
          i +
          'Status'
        ),

      reported:
        $(
          'q' +
          i +
          'Reported'
        ).value,

      note:
        $(
          'q' +
          i +
          'Note'
        ).value

    });

  }


  return {

    monteur:
      $('monteur')
        .value
        .trim(),

    datum:
      $('datum')
        .value,

    pop:
      $('popName')
        .value
        .trim(),

    plaats:
      $('plaats')
        .value
        .trim(),

    generalNotes:
      $('generalNotes')
        .value,

    quality:
      selected(
        'qualityPop'
      ),

    items:
      items

  };

}


function applyState(state){

  if(!state){
    return;
  }


  $('monteur').value =
    state.monteur ||
    '';


  $('datum').value =
    state.datum ||
    today();


  $('popName').value =
    state.pop ||
    '';


  $('plaats').value =
    state.plaats ||
    '';


  $('generalNotes').value =
    state.generalNotes ||
    '';


  if(
    state.quality
  ){

    var qualityRadio =
      document.querySelector(
        'input[name="qualityPop"][value="' +
        state.quality +
        '"]'
      );


    if(qualityRadio){

      qualityRadio.checked =
        true;

    }

  }


  (
    state.items ||
    []
  )
  .slice(
    0,
    15
  )
  .forEach(
    function(
      item,
      index
    ){

      var q =
        index +
        1;


      if(item.status){

        var radio =
          document.querySelector(
            'input[name="q' +
            q +
            'Status"][value="' +
            item.status +
            '"]'
          );


        if(radio){

          radio.checked =
            true;

        }

      }


      $(
        'q' +
        q +
        'Reported'
      ).value =
        item.reported ||
        '';


      $(
        'q' +
        q +
        'Note'
      ).value =
        item.note ||
        '';

    }
  );

}


function saveState(){

  /*
   * Alleen de huidige V7-key wordt voortaan
   * gebruikt voor nieuwe opslag.
   */

  safeStorageSet(
    STORAGE_KEY,
    JSON.stringify(
      getState()
    )
  );

}


function updateProgress(){

  var done =
    0;


  questionCards
    .forEach(
      function(
        card,
        index
      ){

        var status =
          selected(
            'q' +
            (
              index +
              1
            ) +
            'Status'
          );


        if(status){

          done++;

        }


        card.classList.remove(
          'status-ja',
          'status-nee',
          'status-nvt'
        );


        if(
          status === 'Ja'
        ){

          card.classList.add(
            'status-ja'
          );

        }


        if(
          status === 'Nee'
        ){

          card.classList.add(
            'status-nee'
          );

        }


        if(
          status === 'NVT'
        ){

          card.classList.add(
            'status-nvt'
          );

        }

      }
    );


  $('progressCount')
    .textContent =
    done +
    ' / 15';


  $('progressFill')
    .style.width =
    (
      done /
      15 *
      100
    ) +
    '%';

}

/* FOTO DATABASE */

function openPhotoDb(){

  if(dbPromise){

    return dbPromise;

  }


  dbPromise =
    new Promise(
      function(
        resolve,
        reject
      ){

        var request =
          indexedDB.open(
            PHOTO_DB_NAME,
            1
          );


        request.onupgradeneeded =
          function(){

            var database =
              request.result;


            if(
              !database
                .objectStoreNames
                .contains(
                  PHOTO_STORE_NAME
                )
            ){

              database
                .createObjectStore(
                  PHOTO_STORE_NAME,
                  {
                    keyPath:
                      'id'
                  }
                );

            }

          };


        request.onsuccess =
          function(){

            resolve(
              request.result
            );

          };


        request.onerror =
          function(){

            reject(
              request.error
            );

          };

      }
    );


  return dbPromise;

}


function makePhotoId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function savePhoto(record){

  return openPhotoDb()
    .then(
      function(database){

        return new Promise(
          function(
            resolve,
            reject
          ){

            var transaction =
              database.transaction(
                PHOTO_STORE_NAME,
                'readwrite'
              );


            transaction
              .objectStore(
                PHOTO_STORE_NAME
              )
              .put(
                record
              );


            transaction.oncomplete =
              resolve;


            transaction.onerror =
              function(){

                reject(
                  transaction.error
                );

              };

          }
        );

      }
    );

}


function deletePhoto(id){

  return openPhotoDb()
    .then(
      function(database){

        return new Promise(
          function(
            resolve,
            reject
          ){

            var transaction =
              database.transaction(
                PHOTO_STORE_NAME,
                'readwrite'
              );


            transaction
              .objectStore(
                PHOTO_STORE_NAME
              )
              .delete(
                id
              );


            transaction.oncomplete =
              resolve;


            transaction.onerror =
              reject;

          }
        );

      }
    );

}


function loadPhotos(){

  return openPhotoDb()
    .then(
      function(database){

        return new Promise(
          function(
            resolve,
            reject
          ){

            var request =
              database
                .transaction(
                  PHOTO_STORE_NAME,
                  'readonly'
                )
                .objectStore(
                  PHOTO_STORE_NAME
                )
                .getAll();


            request.onsuccess =
              function(){

                resolve(
                  request.result ||
                  []
                );

              };


            request.onerror =
              reject;

          }
        );

      }
    );

}


function clearAllPhotos(){

  return openPhotoDb()
    .then(
      function(database){

        return new Promise(
          function(
            resolve,
            reject
          ){

            var transaction =
              database.transaction(
                PHOTO_STORE_NAME,
                'readwrite'
              );


            transaction
              .objectStore(
                PHOTO_STORE_NAME
              )
              .clear();


            transaction.oncomplete =
              function(){

                resolve();

              };


            transaction.onerror =
              function(){

                reject(
                  transaction.error
                );

              };

          }
        );

      }
    );

}


function getPhotos(question){

  return (
    photoStore[
      question
    ] ||
    []
  );

}


function renderPhotos(question){

  var box =
    $(
      'q' +
      question +
      'PhotoList'
    );


  if(!box){
    return;
  }


  (
    previewUrls[
      question
    ] ||
    []
  )
  .forEach(
    function(url){

      try{

        URL.revokeObjectURL(
          url
        );

      }catch(e){}

    }
  );


  previewUrls[
    question
  ] =
    [];


  var photos =
    getPhotos(
      question
    );


  if(
    !photos.length
  ){

    box.innerHTML =
      '<div class="photo-empty">' +
      (
        question === 15
          ? "Nog geen ODF-/DSLAM-foto's toegevoegd."
          : "Nog geen foto's toegevoegd."
      ) +
      '</div>';


    return;

  }


  box.innerHTML =
    '';


  photos.forEach(
    function(
      photo,
      index
    ){

      var blob =
        new Blob(
          [
            photo.bytes
          ],
          {
            type:
              photo.type
          }
        );


      var url =
        URL.createObjectURL(
          blob
        );


      previewUrls[
        question
      ].push(
        url
      );


      var tile =
        document.createElement(
          'div'
        );


      tile.className =
        'photo-thumb';


      var image =
        document.createElement(
          'img'
        );


      image.src =
        url;


      tile.appendChild(
        image
      );


      var badge =
        document.createElement(
          'span'
        );


      badge.className =
        'photo-index';


      badge.textContent =
        index +
        1;


      tile.appendChild(
        badge
      );


      var remove =
        document.createElement(
          'button'
        );


      remove.type =
        'button';


      remove.className =
        'photo-remove';


      remove.textContent =
        '×';


      remove.onclick =
        function(){

          if(
            !confirm(
              'Deze foto verwijderen?'
            )
          ){

            return;

          }


          deletePhoto(
            photo.id
          )
          .then(
            function(){

              photoStore[
                question
              ] =
                getPhotos(
                  question
                )
                .filter(
                  function(item){

                    return (
                      item.id !==
                      photo.id
                    );

                  }
                );


              renderPhotos(
                question
              );

            }
          );

        };


      tile.appendChild(
        remove
      );


      box.appendChild(
        tile
      );

    }
  );

}


function addFiles(
  question,
  fileList
){

  var files =
    Array.prototype
      .slice
      .call(
        fileList ||
        []
      );


  return Promise.all(
    files.map(
      function(file){

        return file
          .arrayBuffer()
          .then(
            function(buffer){

              var record = {

                id:
                  makePhotoId(),

                question:
                  Number(
                    question
                  ),

                name:
                  file.name ||
                  'foto.jpg',

                type:
                  file.type ||
                  'image/jpeg',

                createdAt:
                  Date.now(),

                bytes:
                  buffer.slice(0)

              };


              return savePhoto(
                record
              )
              .then(
                function(){

                  return record;

                }
              );

            }
          );

      }
    )
  )
  .then(
    function(records){

      if(
        !photoStore[
          question
        ]
      ){

        photoStore[
          question
        ] =
          [];

      }


      records.forEach(
        function(record){

          photoStore[
            question
          ].push(
            record
          );

        }
      );


      renderPhotos(
        question
      );

    }
  );

}

/* VALIDATIE */

function validate(state){

  var missing =
    [];


  if(!state.monteur){

    missing.push(
      'naam monteur'
    );

  }


  if(!state.datum){

    missing.push(
      'datum'
    );

  }


  if(!state.pop){

    missing.push(
      'naam PoP'
    );

  }


  if(!state.plaats){

    missing.push(
      'straat / plaats'
    );

  }


  if(!state.quality){

    missing.push(
      'kwaliteit PoP'
    );

  }


  state.items
    .forEach(
      function(
        item,
        index
      ){

        if(
          !item.status
        ){

          missing.push(
            'punt ' +
            (
              index +
              1
            )
          );

        }


        if(
          item.status ===
            'Nee' &&
          !item.note
            .trim()
        ){

          missing.push(
            'opmerking bij punt ' +
            (
              index +
              1
            )
          );

        }

      }
    );


  if(
    state.items[14] &&
    state.items[14]
      .status ===
      'Ja' &&
    !getPhotos(
      15
    ).length
  ){

    missing.push(
      "foto's bij punt 15"
    );

  }


  return missing;

}


/* EXCEL */

function safeName(value){

  return String(
    value ||
    'PoP'
  )
  .trim()
  .replace(
    /[\\/:*?"<>|]+/g,
    '-'
  )
  .replace(
    /\s+/g,
    '_'
  );

}


function excelName(state){

  return (
    'Checklijst_PoP_' +
    safeName(
      state.pop
    ) +
    '_' +
    safeName(
      state.plaats
    ) +
    '_' +
    displayDate(
      state.datum
    ) +
    '.xlsx'
  );

}


function zipName(state){

  return (
    'PoP_Inspectie_' +
    safeName(
      state.pop
    ) +
    '_' +
    safeName(
      state.plaats
    ) +
    '_' +
    displayDate(
      state.datum
    ) +
    '.zip'
  );

}


function xmlEscape(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    );

}


function cellRegex(ref){

  return new RegExp(
    '<c\\b([^>]*\\br="' +
    ref +
    '"[^>]*)\\/>|' +
    '<c\\b([^>]*\\br="' +
    ref +
    '"[^>]*)>[\\s\\S]*?<\\/c>'
  );

}


function setText(
  xml,
  ref,
  value
){

  var regex =
    cellRegex(
      ref
    );


  var match =
    xml.match(
      regex
    );


  if(!match){

    throw Error(
      'Templatecel ' +
      ref +
      ' niet gevonden'
    );

  }


  var attributes =
    (
      match[1] ||
      match[2] ||
      ''
    )
    .replace(
      /\s+t="[^"]*"/g,
      ''
    );


  var text =
    String(
      value ||
      ''
    );


  return xml.replace(
    regex,
    text
      ? (
        '<c' +
        attributes +
        ' t="inlineStr">' +
        '<is>' +
        '<t xml:space="preserve">' +
        xmlEscape(
          text
        ) +
        '</t>' +
        '</is>' +
        '</c>'
      )
      : (
        '<c' +
        attributes +
        '/>'
      )
  );

}


function setNumber(
  xml,
  ref,
  value
){

  var regex =
    cellRegex(
      ref
    );


  var match =
    xml.match(
      regex
    );


  if(!match){

    throw Error(
      'Templatecel ' +
      ref +
      ' niet gevonden'
    );

  }


  var attributes =
    (
      match[1] ||
      match[2] ||
      ''
    )
    .replace(
      /\s+t="[^"]*"/g,
      ''
    );


  return xml.replace(
    regex,
    '<c' +
    attributes +
    '><v>' +
    Number(
      value
    ) +
    '</v></c>'
  );

}


function excelSerial(iso){

  var parts =
    iso
      .split('-')
      .map(
        Number
      );


  return (
    Math.floor(
      Date.UTC(
        parts[0],
        parts[1] - 1,
        parts[2]
      ) /
      86400000
    ) +
    25569
  );

}


/* ZIP LEZEN */

function findEOCD(bytes){

  for(
    var i =
      bytes.length -
      22;

    i >=
    Math.max(
      0,
      bytes.length -
      65557
    );

    i--
  ){

    if(
      bytes[i] ===
        0x50 &&
      bytes[i + 1] ===
        0x4b &&
      bytes[i + 2] ===
        0x05 &&
      bytes[i + 3] ===
        0x06
    ){

      return i;

    }

  }


  throw Error(
    'Ongeldige XLSX'
  );

}


function parseZip(bytes){

  var view =
    new DataView(
      bytes.buffer,
      bytes.byteOffset,
      bytes.byteLength
    );


  var end =
    findEOCD(
      bytes
    );


  var count =
    view.getUint16(
      end +
      10,
      true
    );


  var pointer =
    view.getUint32(
      end +
      16,
      true
    );


  var decoder =
    new TextDecoder();


  var entries =
    [];


  for(
    var i = 0;
    i < count;
    i++
  ){

    var nameLength =
      view.getUint16(
        pointer +
        28,
        true
      );


    var extraLength =
      view.getUint16(
        pointer +
        30,
        true
      );


    var commentLength =
      view.getUint16(
        pointer +
        32,
        true
      );


    var localOffset =
      view.getUint32(
        pointer +
        42,
        true
      );


    var nameBytes =
      bytes.slice(
        pointer +
        46,
        pointer +
        46 +
        nameLength
      );


    var name =
      decoder.decode(
        nameBytes
      );


    var localNameLength =
      view.getUint16(
        localOffset +
        26,
        true
      );


    var localExtraLength =
      view.getUint16(
        localOffset +
        28,
        true
      );


    var dataStart =
      localOffset +
      30 +
      localNameLength +
      localExtraLength;


    var compressedSize =
      view.getUint32(
        pointer +
        20,
        true
      );


    entries.push({

      name:
        name,

      nameBytes:
        nameBytes,

      method:
        view.getUint16(
          pointer +
          10,
          true
        ),

      crc:
        view.getUint32(
          pointer +
          16,
          true
        ),

      compSize:
        compressedSize,

      uncompSize:
        view.getUint32(
          pointer +
          24,
          true
        ),

      versionMade:
        view.getUint16(
          pointer +
          4,
          true
        ),

      versionNeeded:
        view.getUint16(
          pointer +
          6,
          true
        ),

      flags:
        view.getUint16(
          pointer +
          8,
          true
        ),

      time:
        view.getUint16(
          pointer +
          12,
          true
        ),

      date:
        view.getUint16(
          pointer +
          14,
          true
        ),

      compressed:
        bytes.slice(
          dataStart,
          dataStart +
          compressedSize
        )

    });


    pointer +=
      46 +
      nameLength +
      extraLength +
      commentLength;

  }


  return entries;

}


function u16(value){

  var output =
    new Uint8Array(
      2
    );


  new DataView(
    output.buffer
  )
  .setUint16(
    0,
    value,
    true
  );


  return output;

}


function u32(value){

  var output =
    new Uint8Array(
      4
    );


  new DataView(
    output.buffer
  )
  .setUint32(
    0,
    value >>> 0,
    true
  );


  return output;

}


function concat(parts){

  var size =
    parts.reduce(
      function(
        total,
        part
      ){

        return (
          total +
          part.length
        );

      },
      0
    );


  var output =
    new Uint8Array(
      size
    );


  var offset =
    0;


  parts.forEach(
    function(part){

      output.set(
        part,
        offset
      );


      offset +=
        part.length;

    }
  );


  return output;

}


var CRC_TABLE =
  null;


function crc32(bytes){

  if(!CRC_TABLE){

    CRC_TABLE =
      new Uint32Array(
        256
      );


    for(
      var n = 0;
      n < 256;
      n++
    ){

      var c =
        n;


      for(
        var k = 0;
        k < 8;
        k++
      ){

        c =
          c & 1
            ? (
              0xedb88320 ^
              (
                c >>>
                1
              )
            )
            : (
              c >>>
              1
            );

      }


      CRC_TABLE[
        n
      ] =
        c >>>
        0;

    }

  }


  var result =
    0xffffffff;


  for(
    var i = 0;
    i < bytes.length;
    i++
  ){

    result =
      CRC_TABLE[
        (
          result ^
          bytes[i]
        ) &
        255
      ] ^
      (
        result >>>
        8
      );

  }


  return (
    result ^
    0xffffffff
  ) >>>
  0;

}


/* ZIP MAKEN */

function makeZip(files){

  var encoder =
    new TextEncoder();


  var locals =
    [];


  var centrals =
    [];


  var metadata =
    [];


  var offset =
    0;


  var now =
    new Date();


  var dosTime =
    (
      now.getHours() <<
      11
    ) |
    (
      now.getMinutes() <<
      5
    ) |
    Math.floor(
      now.getSeconds() /
      2
    );


  var dosDate =
    (
      (
        now.getFullYear() -
        1980
      ) <<
      9
    ) |
    (
      (
        now.getMonth() +
        1
      ) <<
      5
    ) |
    now.getDate();


  files.forEach(
    function(file){

      var name =
        encoder.encode(
          file.name
        );


      var data =
        file.bytes;


      var crc =
        crc32(
          data
        );


      var local =
        concat([

          u32(
            0x04034b50
          ),

          u16(20),

          u16(
            0x0800
          ),

          u16(0),

          u16(
            dosTime
          ),

          u16(
            dosDate
          ),

          u32(
            crc
          ),

          u32(
            data.length
          ),

          u32(
            data.length
          ),

          u16(
            name.length
          ),

          u16(0),

          name

        ]);


      locals.push(
        local,
        data
      );


      metadata.push({

        name:
          name,

        data:
          data,

        crc:
          crc,

        offset:
          offset

      });


      offset +=
        local.length +
        data.length;

    }
  );


  var centralOffset =
    offset;


  metadata.forEach(
    function(entry){

      var central =
        concat([

          u32(
            0x02014b50
          ),

          u16(20),

          u16(20),

          u16(
            0x0800
          ),

          u16(0),

          u16(
            dosTime
          ),

          u16(
            dosDate
          ),

          u32(
            entry.crc
          ),

          u32(
            entry.data.length
          ),

          u32(
            entry.data.length
          ),

          u16(
            entry.name.length
          ),

          u16(0),

          u16(0),

          u16(0),

          u16(0),

          u32(0),

          u32(
            entry.offset
          ),

          entry.name

        ]);


      centrals.push(
        central
      );


      offset +=
        central.length;

    }
  );


  return concat([

    ...locals,

    ...centrals,

    u32(
      0x06054b50
    ),

    u16(0),

    u16(0),

    u16(
      metadata.length
    ),

    u16(
      metadata.length
    ),

    u32(
      offset -
      centralOffset
    ),

    u32(
      centralOffset
    ),

    u16(0)

  ]);

}


/* TEMPLATE LADEN */

function preloadTemplate(){

  return fetch(
    TEMPLATE_FILE_NAME,
    {
      cache:
        'no-store'
    }
  )
  .then(
    function(response){

      if(!response.ok){

        throw Error(
          'template.xlsx niet gevonden'
        );

      }


      return response
        .arrayBuffer();

    }
  )
  .then(
    function(buffer){

      templateBytesCache =
        new Uint8Array(
          buffer
        );

    }
  )
  .catch(
    function(error){

      templateLoadError =
        error;

    }
  );

}


/* EXCEL BOUWEN */

function buildExcel(state){

  if(
    !templateBytesCache
  ){

    throw Error(
      'Excel-template is niet geladen. Vernieuw de pagina en controleer of template.xlsx naast index.html staat.'
    );

  }


  var original =
    templateBytesCache
      .slice();


  var entries =
    parseZip(
      original
    );


  var sheet =
    entries.find(
      function(entry){

        return (
          entry.name ===
          TARGET_SHEET
        );

      }
    );


  if(!sheet){

    throw Error(
      'Werkblad niet gevonden'
    );

  }


  if(
    sheet.method !==
    0
  ){

    throw Error(
      'Gebruik de nieuwe template.xlsx.'
    );

  }


  var xml =
    new TextDecoder()
      .decode(
        sheet.compressed
      );


  xml =
    setText(
      xml,
      'D1',
      state.monteur
    );


  xml =
    setText(
      xml,
      'D2',
      state.pop
    );


  xml =
    setNumber(
      xml,
      'H1',
      excelSerial(
        state.datum
      )
    );


  xml =
    setText(
      xml,
      'H2',
      state.plaats
    );


  state.items
    .forEach(
      function(
        item,
        index
      ){

        var row =
          5 +
          index;


        xml =
          setText(
            xml,
            'E' +
            row,
            item.status
          );


        xml =
          setText(
            xml,
            'F' +
            row,
            getPhotos(
              index +
              1
            ).length
              ? 'Ja'
              : ''
          );


        xml =
          setText(
            xml,
            'G' +
            row,
            item.reported
          );


        xml =
          setText(
            xml,
            'H' +
            row,
            item.note
              .trim()
          );

      }
    );


  xml =
    setText(
      xml,
      'C26',
      state.generalNotes
        .trim()
    );


  xml =
    setText(
      xml,
      'H26',
      state.quality
    );


  var files =
    [];


  entries.forEach(
    function(entry){

      if(
        entry.name ===
        TARGET_SHEET
      ){

        files.push({

          name:
            entry.name,

          bytes:
            new TextEncoder()
              .encode(
                xml
              )

        });

      }else{

        if(
          entry.method !==
          0
        ){

          throw Error(
            'template.xlsx bevat nog gecomprimeerde bestanden. Gebruik de nieuwe template.'
          );

        }


        files.push({

          name:
            entry.name,

          bytes:
            entry.compressed

        });

      }

    }
  );


  return makeZip(
    files
  );

}


/* FOTO EXPORT */

function exportPhotos(){

  var output =
    [];


  for(
    var question = 1;
    question <= 15;
    question++
  ){

    getPhotos(
      question
    )
    .forEach(
      function(
        photo,
        index
      ){

        var extension =
          'jpg';


        if(
          photo.type ===
          'image/png'
        ){

          extension =
            'png';

        }


        if(
          photo.type ===
          'image/webp'
        ){

          extension =
            'webp';

        }


        output.push({

          name:
            'Vraag_' +
            String(
              question
            ).padStart(
              2,
              '0'
            ) +
            '_foto_' +
            String(
              index +
              1
            ).padStart(
              2,
              '0'
            ) +
            '.' +
            extension,

          type:
            photo.type,

          bytes:
            new Uint8Array(
              photo.bytes
            )

        });

      }
    );

  }


  return output;

}


/* DOWNLOAD */

function download(
  bytes,
  filename,
  type
){

  var blob =
    new Blob(
      [
        bytes
      ],
      {
        type:
          type
      }
    );


  var url =
    URL.createObjectURL(
      blob
    );


  var anchor =
    document.createElement(
      'a'
    );


  anchor.href =
    url;


  anchor.download =
    filename;


  document.body
    .appendChild(
      anchor
    );


  anchor.click();


  anchor.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    2000
  );

}

/* MAIL */

function mailText(state){

  var lines = [

    'PoP inspectie',

    '',

    'PoP naam: ' +
    state.pop,

    'Stad / plaats: ' +
    state.plaats,

    'Datum: ' +
    displayDate(
      state.datum
    ),

    '',

    'Checklist:'

  ];


  state.items
    .forEach(
      function(
        item,
        index
      ){

        lines.push(
          (
            index +
            1
          ) +
          '. ' +
          (
            item.status ||
            'Niet ingevuld'
          )
        );

      }
    );


  if(
    state.generalNotes
      .trim()
  ){

    lines.push(
      '',
      'Overige opmerkingen:',
      state.generalNotes
        .trim()
    );

  }


  return lines.join(
    '\n'
  );

}


function shareWeb(
  title,
  text,
  excel,
  photos,
  state
){

  if(
    !navigator.share ||
    typeof File ===
    'undefined'
  ){

    return false;

  }


  var files = [

    new File(
      [
        excel
      ],
      excelName(
        state
      ),
      {
        type:
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      }
    )

  ];


  photos.forEach(
    function(photo){

      files.push(

        new File(
          [
            photo.bytes
          ],
          photo.name,
          {
            type:
              photo.type
          }
        )

      );

    }
  );


  if(
    navigator.canShare &&
    !navigator.canShare({
      files:
        files
    })
  ){

    return false;

  }


  navigator.share({

    title:
      title,

    text:
      text,

    files:
      files

  });


  return true;

}

      getState();

      );

    ){

            .slice(

              8
            )

        )

      }

        );

/* FORMULIER LEGEN */

$('clearFormButton').onclick =
  function(){

    $('settingsPanel')
      .classList
      .remove(
        'open'
      );


    if(
      !confirm(
        "Formulier legen? Alle ingevulde gegevens en foto's worden verwijderd. Naam monteur blijft behouden."
      )
    ){

      return;

    }


    /*
     * Naam blijft behouden.
     */
    var name =
      $('monteur')
        .value
        .trim();


    /*
     * Huidige datum NU opnieuw bepalen.
     * De oude ingevulde datum wordt dus
     * nooit hergebruikt.
     */
    var currentDate =
      today();


    /*
     * Alle vragen leeg.
     */
    document
      .querySelectorAll(
        'input[type="radio"]'
      )
      .forEach(
        function(input){

          input.checked =
            false;

        }
      );


    /*
     * Alle Gemeld-keuzes leeg.
     */
    document
      .querySelectorAll(
        'select'
      )
      .forEach(
        function(select){

          select.value =
            '';

        }
      );


    /*
     * Alle opmerkingen leeg.
     */
    document
      .querySelectorAll(
        'textarea'
      )
      .forEach(
        function(textarea){

          textarea.value =
            '';

        }
      );


    /*
     * Alleen naam + actuele datum terugzetten.
     */
    $('monteur').value =
      name;


    $('datum').value =
      currentDate;


    $('popName').value =
      '';


    $('plaats').value =
      '';


    /*
     * BELANGRIJK:
     *
     * Eerst ALLE oude formulieropslag verwijderen.
     * Hierdoor kan V3/V5/V6/V7 na een refresh
     * nooit als oude fallback terugkomen.
     */
    clearOldFormStorage();


    /*
     * Meteen daarna het NIEUWE lege formulier
     * opslaan onder V7.
     *
     * Daardoor staat zelfs wanneer iemand direct
     * na Formulier legen de pagina afsluit,
     * al de juiste lege toestand opgeslagen.
     */
    saveState();


    /*
     * Foto's volledig verwijderen.
     */
    clearAllPhotos()
      .then(
        function(){

          photoStore =
            {};


          for(
            var q = 1;
            q <= 15;
            q++
          ){

            photoStore[
              q
            ] =
              [];


            renderPhotos(
              q
            );

          }


          updateProgress();


          /*
           * Nog één keer opslaan na volledig legen.
           */
          saveState();


          if(
            typeof showToast ===
            'function'
          ){

            showToast(
              'Formulier geleegd'
            );

          }


          window.scrollTo({
            top:
              0,

            behavior:
              'smooth'
          });

        }
      )
      .catch(
        function(error){

          console.error(
            'Foto-opslag legen mislukt:',
            error
          );


          /*
           * Formulierdata is op dit moment
           * al correct geleegd en opgeslagen.
           */
          updateProgress();
          saveState();

        }
      );

  };


/* INIT */

(function init(){

  setTheme(
    safeStorageGet(
      'toolsTheme'
    ) ||
    'dark'
  );


  /*
   * Eerst huidige V7 proberen.
   *
   * Alleen voor een bestaande installatie
   * zonder V7 mag V6 nog één keer worden
   * gemigreerd.
   *
   * Zodra Formulier legen is gebruikt,
   * bestaat altijd een nieuwe lege V7 en
   * komt deze fallback dus niet meer in beeld.
   */
  var saved =
    safeStorageGet(
      STORAGE_KEY
    );


  if(!saved){

    var legacy =
      safeStorageGet(
        'popInspectieChecklistV6'
      );


    if(legacy){

      saved =
        legacy;


      /*
       * Oude V6 direct verwijderen nadat
       * hij één keer is gevonden.
       */
      safeStorageRemove(
        'popInspectieChecklistV6'
      );

    }

  }


  if(saved){

    try{

      applyState(
        JSON.parse(
          saved
        )
      );

      /*
       * Na eventuele V6-migratie meteen als V7
       * opslaan zodat V6 nooit meer nodig is.
       */
      saveState();


    }catch(error){

      console.error(
        'Opgeslagen formulier kon niet worden geladen:',
        error
      );

    }

  }


  /*
   * Als er geen geldige opgeslagen datum is,
   * altijd de huidige datum gebruiken.
   */
  if(
    !$('datum').value
  ){

    $('datum').value =
      today();

  }


  updateProgress();


  loadPhotos()
    .then(
      function(records){

        records.forEach(
          function(record){

            var question =
              Number(
                record.question
              );


            if(
              !photoStore[
                question
              ]
            ){

              photoStore[
                question
              ] =
                [];

            }


            photoStore[
              question
            ].push(
              record
            );

          }
        );


        for(
          var q = 1;
          q <= 15;
          q++
        ){

          renderPhotos(
            q
          );

        }

      }
    );


  preloadTemplate();

})();
